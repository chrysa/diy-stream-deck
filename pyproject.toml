[tool.ruff]
extend-exclude = [".claude", "scripts/quality_gate.py"]
# py313 (not py314): ruff format <=0.15.15 strips multi-except parens under py314 — restore when fixed upstream
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "C4", "T20", "C901", "PERF203", "PERF401", "PLR0402", "PLR0911", "PLR0912", "PLR0915", "PLR1714", "PLR1730", "PLR5501", "RUF005", "RUF006", "RUF007", "RUF009", "RUF012", "RUF013", "RUF022", "RUF043", "RUF059", "RUF100", "PLR2004"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=diy_stream_deck --cov-report=xml --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["diy_stream_deck"]
omit = ["tests/*"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", "alembic", ".venv", ".claude"]
[project]
name = "diy-stream-deck"
version = "0.1.0"
description = "DIY Stream Deck alternative compatible with Linux and Windows"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
    "pynput>=1.7",
]

[project.optional-dependencies]
linux = [
    "evdev>=1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[project.scripts]
diy-stream-deck = "diy_stream_deck.__main__:main"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]
"**/conftest.py" = ["PLR2004"]
