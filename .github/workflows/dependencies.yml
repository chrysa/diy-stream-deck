on:
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Check PR dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: gregsdennis/dependencies-action@1ba6872857f9adb872a430d5beb027fe10344086 # v1.4.3
