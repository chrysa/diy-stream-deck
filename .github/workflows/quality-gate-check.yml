on:
  pull_request:
    branches:
      - develop
      - main
      - master
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
      - master
permissions:
  contents: read
  checks: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: No-Regression Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - continue-on-error: true
        name: Set up Node.js (if needed)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          cache: npm
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f package.json ]; then npm ci; fi
      - id: quality-gate
        name: Run quality gate verification
        run: |
          if [ ! -f .quality-gate-baseline.json ]; then
            echo "ℹ️ No baseline found — skipping quality gate (run quality-gate-baseline on main first)"
            exit 0
          fi
          make quality-gate-verify || exit_code=$?
          exit "${exit_code:-0}"
      - if: always()
        name: Report quality gate status
        run: |
          if [ ${{ steps.quality-gate.outcome }} == 'success' ]; then
            echo "✅ All quality gates passed"
            exit 0
          else
            echo "❌ Quality gate regression detected"
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.quality-gate.outcome }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Dependabot tokens are read-only: the check run above already carries the result.
        if: always() && github.actor != 'dependabot[bot]'
        name: Set quality-gate commit status
        run: |
          STATE="success"
          DESCRIPTION="All quality gates passed"
          if [ "$OUTCOME" != "success" ]; then
            STATE="failure"
            DESCRIPTION="Quality gate regression detected"
          fi
          gh api "repos/${REPO}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context="quality-gate" \
            -f description="${DESCRIPTION}"
